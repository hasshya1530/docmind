[project]
name = "docmind"
version = "0.1.0"
description = "Document Q&A application using Retrieval-Augmented Generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastembed>=0.8.1",
    "google-genai>=2.25.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-text-splitters>=1.1.2",
    "onnxruntime==1.20.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

